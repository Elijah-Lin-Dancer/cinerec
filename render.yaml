# CineRec — Render blueprint (the product, `lite` mode)
#
# Render's free web instance is 0.1 CPU / 512 MB and sleeps after ~15 min idle.
# `APP_MODE=lite` keeps the image small enough to build and run there, serving
# from the precomputed cache; `.github/workflows/keepalive.yml` keeps it warm.
# See docs/adr/0001-dual-mode-deployment.md for the hosting decision.
#
# Deploy: Render Dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: cinerec
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # The Blueprint schema has no `dockerBuildArgs` field. Render instead
    # translates a service's env vars into Docker build args, so the
    # `APP_MODE=lite` below is what the Dockerfile's `ARG APP_MODE` sees at
    # build time (and at runtime). See render.com/docs/docker.
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_MODE
        value: lite
      # Render generates a random value, so session tokens cannot be forged.
      - key: CINEREC_SECRET
        generateValue: true
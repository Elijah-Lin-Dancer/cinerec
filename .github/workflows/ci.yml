name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch only: unlocks the 4 torch-gated neural-model tests without
          # pulling the CUDA wheel or the heavy train-only stack (transfomers
          # etc.), keeping CI fast. Features/models ship precomputed.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (with coverage)
        run: pytest -q --cov --cov-report=term-missing

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # `lite` mode serves the precomputed cache, so torch is not needed here.
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Browser journeys + a11y assertions
        # `-o addopts=""` clears the default `-m 'not e2e'` exclusion.
        run: pytest -m e2e -o addopts="" -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lite image
        run: docker build --build-arg APP_MODE=lite -t cinerec:lite .
      - name: Build full image
        run: docker build --build-arg APP_MODE=full -t cinerec:full .
      - name: Smoke test full image (run + probe /api/health)
        run: |
          docker run -d --name cinerec-smoke -p 8000:8000 cinerec:full
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          echo "Smoke test passed."
          docker logs cinerec-smoke
          docker rm -f cinerec-smoke
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU torch only: unlocks the 4 torch-gated neural-model tests without
          # pulling the CUDA wheel or the heavy train-only stack (transfomers
          # etc.), keeping CI fast. Features/models ship precomputed.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (with coverage)
        run: pytest -q --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lite image
        run: docker build --build-arg APP_MODE=lite -t cinerec:lite .
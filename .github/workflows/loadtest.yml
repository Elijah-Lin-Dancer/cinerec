name: Load test (scheduled)

# Runs the Locust profile against a `lite` server on a schedule and appends the
# aggregated result to reports/loadtest_trend.csv, so performance is tracked over
# time rather than only in the latest report. The trend file is committed back to
# main (requires `contents: write`); the full HTML/CSV report is uploaded as an
# artifact. Run it on demand from the Actions tab via workflow_dispatch.

on:
  schedule:
    # Mondays at 03:00 UTC (off-peak, after the weekly CI load).
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  loadtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # `lite` mode serves the precomputed cache, so torch is not needed.
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run load test against a lite server
        run: |
          APP_MODE=lite CINEREC_SECRET=loadtest python -m uvicorn api.main:app \
            --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health

          python -m locust -f scripts/locustfile.py --headless -u 30 -r 10 -t 30s \
            --host http://127.0.0.1:8000 \
            --csv reports/locust_scheduled \
            --html reports/locust_scheduled.html

      - name: Append run to the trend file
        run: |
          python scripts/loadtest_trend.py \
            --stats reports/locust_scheduled_stats.csv \
            --trend reports/loadtest_trend.csv

      - name: Upload report and trend
        uses: actions/upload-artifact@v4
        with:
          name: locust-report
          path: |
            reports/locust_scheduled.html
            reports/locust_scheduled_stats.csv
            reports/loadtest_trend.csv

      - name: Commit the trend back to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/loadtest_trend.csv
          if git diff --cached --quiet; then
            echo "Trend unchanged — nothing to commit."
          else
            git commit -m "chore: record scheduled load-test trend [skip ci]"
            git push
          fi
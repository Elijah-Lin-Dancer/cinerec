name: Keepalive

# Render's free tier sleeps after ~15 minutes of inactivity, so the lite
# deployment is pinged on a schedule to keep it warm. The Streamlit companion
# has its own wake-on-visit behaviour and needs no ping — this only targets the
# URL below.
#
# Configure the target once: Settings → Secrets and variables → Actions →
# Variables → add `KEEPALIVE_URL`, using the exact host Render assigned —
# suffix included, e.g. https://cinerec-rfew.onrender.com. The bare service
# name from render.yaml (cinerec.onrender.com) is a different host and does
# not serve this app.
# When it is unset the job is a no-op, so forks do not fail.

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployment health endpoint
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "KEEPALIVE_URL is not configured — nothing to ping."
            exit 0
          fi
          # A sleeping free instance can take ~30-40 s to answer its first
          # request, so allow a generous per-attempt ceiling, but give up
          # quickly when the host is unreachable rather than burning it.
          curl -fsS --connect-timeout 10 --max-time 90 \
            --retry 2 --retry-delay 5 "$KEEPALIVE_URL/api/health"
          echo
          echo "OK: $KEEPALIVE_URL is awake."
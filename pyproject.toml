[project]
name = "cinerec"
version = "1.0.0"
description = "Multi-Modal Movie Recommendation System — a 5-level algorithm ladder with explainable AI"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["data", "frontend", ".venv", "docs", "build", "dist"]

[tool.ruff.lint]
# Focused, low-noise ruleset: real errors and dead code, not style bikeshedding.
select = ["E", "F", "W"]
ignore = [
    "E402",  # module-level imports not at top (intentional: sys.path bootstrap)
    "E501",  # line length is handled by the formatter, not the linter
    "W291",  # trailing whitespace
    "W293",
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["api", "models", "evaluation", "db", "config"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
# Training/plotting scripts are exercised by running them, not by unit tests.
exclude_lines = ["if __name__ == .__main__.:"]
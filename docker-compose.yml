services:
  web:
    build:
      context: .
      args:
        APP_MODE: ${APP_MODE:-full}
    container_name: cinerec
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      # Docker Compose auto-loads a `.env` file for interpolation, so this works
      # on a fresh clone even when no `.env` exists (env_file would hard-fail).
      - APP_MODE=${APP_MODE:-full}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # Session-token signing key. Empty means "generate an ephemeral key", which
      # is safe but logs out all users on restart — set it for a real deployment.
      - CINEREC_SECRET=${CINEREC_SECRET:-}
    restart: unless-stopped